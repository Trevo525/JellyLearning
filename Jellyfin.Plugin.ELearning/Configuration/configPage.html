<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JellyLearning</title>
</head>
<body>
    <div id="ELearningConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="ELearningConfigForm">
                    <h2>Course libraries</h2>
                    <div class="fieldDescription">Shows libraries whose folders are e-learning courses.</div>
                    <div id="CourseLibraries" class="checkboxList"></div>

                    <h2>Lecture completion</h2>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="CompletionSecondsFromEnd">Seconds from end</label>
                        <input id="CompletionSecondsFromEnd" name="CompletionSecondsFromEnd" type="number" is="emby-input" min="0" />
                        <div class="fieldDescription">A lecture is completed once playback stops within this many seconds of its end.</div>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="CompletionPercent">Percent watched</label>
                        <input id="CompletionPercent" name="CompletionPercent" type="number" is="emby-input" min="1" max="100" />
                        <div class="fieldDescription">...or once this percentage has been reached, whichever comes first. Otherwise the exact resume position is kept.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var ELearningConfig = {
                pluginUniqueId: '092fc611-a198-4746-b4db-c1d2cca7ddc3'
            };

            function renderLibraries(libraries, selectedIds) {
                var container = document.querySelector('#CourseLibraries');
                container.innerHTML = '';
                libraries
                    .filter(function (lib) { return lib.CollectionType === 'tvshows'; })
                    .forEach(function (lib) {
                        var label = document.createElement('label');
                        label.className = 'emby-checkbox-label';
                        var input = document.createElement('input');
                        input.type = 'checkbox';
                        input.setAttribute('is', 'emby-checkbox');
                        input.dataset.id = lib.ItemId;
                        input.checked = selectedIds.indexOf(lib.ItemId.replace(/-/g, '')) !== -1;
                        var span = document.createElement('span');
                        span.textContent = lib.Name;
                        label.appendChild(input);
                        label.appendChild(span);
                        container.appendChild(label);
                    });
                if (!container.children.length) {
                    container.textContent = 'No Shows libraries found.';
                }
            }

            document.querySelector('#ELearningConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    Promise.all([
                        ApiClient.getPluginConfiguration(ELearningConfig.pluginUniqueId),
                        ApiClient.getVirtualFolders()
                    ]).then(function (results) {
                        var config = results[0];
                        var selected = (config.CourseLibraryIds || []).map(function (id) { return id.replace(/-/g, ''); });
                        renderLibraries(results[1], selected);
                        document.querySelector('#CompletionSecondsFromEnd').value = config.CompletionSecondsFromEnd;
                        document.querySelector('#CompletionPercent').value = config.CompletionPercent;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#ELearningConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ELearningConfig.pluginUniqueId).then(function (config) {
                        config.CourseLibraryIds = Array.prototype.map.call(
                            document.querySelectorAll('#CourseLibraries input:checked'),
                            function (input) { return input.dataset.id; });
                        config.CompletionSecondsFromEnd = parseInt(document.querySelector('#CompletionSecondsFromEnd').value, 10);
                        config.CompletionPercent = parseInt(document.querySelector('#CompletionPercent').value, 10);
                        ApiClient.updatePluginConfiguration(ELearningConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
