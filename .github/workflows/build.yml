# Tests every push; a tag like v0.1.0 also builds the plugin zip and attaches it to a GitHub release.
# Install from a release: unzip into Jellyfin's plugins folder (see README, "Install").
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # GitHub only: a mirror that also reads .github/workflows skips the run (release needs test).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --nologo

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package
        run: build/package.sh "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/release-notes.py > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" artifacts/release/*.zip artifacts/release/*.sha256 --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
