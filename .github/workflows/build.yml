# Tests every push; a tag like v0.1.0 also builds the plugin zip, attaches it to a GitHub release and adds
# the release to manifest.json on main (the plugin repository URL in the README, "Install").
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # GitHub only: a mirror that also reads .github/workflows skips the run (release needs test).
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --nologo

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Package
        run: build/package.sh "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build/release-notes.py > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" artifacts/release/*.zip artifacts/release/*.sha256 --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Add the release to manifest.json on main
        run: |
          git fetch origin main
          git show origin/main:manifest.json > "$RUNNER_TEMP/manifest.json"
          build/update-manifest.py "$GITHUB_REF_NAME" artifacts/release/JellyLearning_*.zip "$RUNNER_TEMP/manifest.json"
          git checkout -q -B main origin/main
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "manifest.json: add $GITHUB_REF_NAME"
          git push origin main
