---
# Throwaway Jellyfin instance for developing/testing the E-Learning plugin.
# All runtime state lives in ./jellyfin/ (gitignored).
#   docker compose -f dev/docker-compose.yml up -d
#   open http://localhost:8096
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:version-12.2ubu2604  # pinned to the target server version; plugin packages must match
    container_name: jellyfin-elearning-dev
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./jellyfin/config:/config
      # Course fixtures (generated by dev/make-fixtures.sh) -> add as a Shows library.
      - ./jellyfin/courses:/data/courses
      # Real course exports, read-only so nothing can modify the sources.
      # Override the host path per machine with ELEARNING_SOURCE in dev/.env.
      - ${ELEARNING_SOURCE:-/path/to/courses}:/data/elearning:ro
    ports:
      - 8096:8096
      # 8920 (HTTPS), 7359/udp (discovery) and 1900/udp (DLNA) left out so this
      # dev instance can't collide with or be discovered alongside a real server.
    restart: unless-stopped
