---
# Dev Jellyfin for JellyLearning, set up end to end:
#   docker compose -f dev/compose.yaml up -d      then http://localhost:8096 (logins in dev/.env)
# 1. plugin   builds the plugin (dotnet SDK image) into Jellyfin's plugins folder
# 2. fixtures generates the tiny test courses from tests/.../Fixtures/Listings (if they changed)
# 3. jellyfin Jellyfin 12.2, started once both are done
# 4. setup    startup wizard, File Transformation, course libraries, plugin settings, API key;
#             writes the logins and the key to dev/.env (see dev/README.md)
# Every `up` repeats 1, 2 and 4 (setup leaves existing settings alone). Runtime state lives in
# ./jellyfin/ (gitignored, override with DEV_STATE); settings are read from dev/.env.
services:
  plugin:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - NUGET_PACKAGES=/state/.nuget
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_NOLOGO=1
    volumes:
      - ..:/src:ro
      - ${DEV_STATE:-./jellyfin}:/state
    command: ["bash", "/src/dev/build-plugin.sh"]

  fixtures:
    image: &jellyfin-image lscr.io/linuxserver/jellyfin:version-12.2ubu2604  # pinned to the target server version; plugin packages must match
    entrypoint: ["bash", "/src/dev/make-fixtures.sh", "--if-changed"]
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FIXTURES_OUT=/state/courses
      - PATH=/usr/lib/jellyfin-ffmpeg:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ..:/src:ro
      - ${DEV_STATE:-./jellyfin}:/state

  jellyfin:
    image: *jellyfin-image
    depends_on:
      plugin: { condition: service_completed_successfully }
      fixtures: { condition: service_completed_successfully }
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Etc/UTC
    volumes:
      - ${DEV_STATE:-./jellyfin}/config:/config
      # Course fixtures (generated by the fixtures service / dev/make-fixtures.sh).
      - ${DEV_STATE:-./jellyfin}/courses:/data/courses
      # Optional: real course exports, read-only so nothing can modify the sources. Set
      # ELEARNING_SOURCE in dev/.env to a folder of courses; setup then adds a "Courses" library.
      - ${ELEARNING_SOURCE:-${DEV_STATE:-./jellyfin}/no-real-courses}:/data/elearning:ro
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
      # 8920 (HTTPS), 7359/udp (discovery) and 1900/udp (DLNA) left out so this
      # dev instance can't collide with or be discovered alongside a real server.
    restart: unless-stopped

  setup:
    image: python:3.13-slim
    depends_on:
      jellyfin: { condition: service_started }
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_HOST_URL=http://localhost:${JELLYFIN_PORT:-8096}
      - SETUP_ENV_FILE=${SETUP_ENV_FILE:-/dev-dir/.env}
    volumes:
      - .:/dev-dir
      - ${DEV_STATE:-./jellyfin}:/state
      - ${ELEARNING_SOURCE:-${DEV_STATE:-./jellyfin}/no-real-courses}:/data/elearning:ro
    command: ["python3", "-u", "/dev-dir/setup.py"]
